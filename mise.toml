[tools]
betterleaks = "latest"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "v1.7.1"
shellcheck = "latest"
zizmor = "latest"
hk = "latest"
pkl = "latest"
tombi = "latest"
yamllint = "latest"

[tasks.install]
description = "Install tools, hook up hooks, and prepare environment"
run = """
hk install --mise
"""

[tasks.hk]
description = "Run hk checks on all files"
alias = "check"
run = """
hk check --all
"""

[tasks.helm-l]
description = "Lint Helm chart"
depends = ["helm-d"]
run = """
helm lint chart/
"""

[tasks.helm-t]
description = "Render Helm chart templates"
depends = ["helm-d"]
run = """
helm template argocd chart/ --namespace argocd > rendered.yaml
"""

[tasks.helm-i]
description = "Install Helm chart"
depends = ["helm-d"]
run = """
helm upgrade --install argocd chart/ --namespace argocd --create-namespace
"""

[tasks.helm-u]
description = "Uninstall Helm chart"
run = """
helm uninstall argocd --namespace argocd
"""

[tasks.helm-d]
description = "Build Helm chart dependencies"
run = """
helm dependency build chart/
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""
